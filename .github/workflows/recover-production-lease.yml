name: Recover Stale Production Lease

on:
  workflow_dispatch:
    inputs:
      failed_run_id:
        description: Failed Release Production Console workflow run ID
        required: true
        type: string
      failed_release_sha:
        description: Full source SHA used by the failed release
        required: true
        type: string
      confirmation:
        description: Type BREAK STALE WORKFORCE OS PRODUCTION LEASE FOR followed by the run ID
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: workforce-os-production
  cancel-in-progress: false

jobs:
  recover-production-lease:
    name: Recover Stale Production Lease
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: workforce-os-production

    steps:
      - name: Admit exact failed release
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          FAILED_RELEASE_SHA: ${{ inputs.failed_release_sha }}
          FAILED_RUN_ID: ${{ inputs.failed_run_id }}
          GH_TOKEN: ${{ github.token }}
          REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          if [[ ! "${FAILED_RUN_ID}" =~ ^[1-9][0-9]*$ ||
            ! "${FAILED_RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ||
            "${CONFIRMATION}" != "BREAK STALE WORKFORCE OS PRODUCTION LEASE FOR ${FAILED_RUN_ID}" ||
            "${GITHUB_REF}" != "refs/heads/main" || "${REF_PROTECTED}" != "true" ]]; then
            echo "ERROR: stale-lease recovery requires protected main and the exact run-bound confirmation" >&2
            exit 1
          fi

          remote_main_sha="$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
            --jq '.object.sha')"
          if [[ "${remote_main_sha}" != "${GITHUB_SHA}" ]]; then
            echo "ERROR: recovery workflow commit is not the current remote main head" >&2
            exit 1
          fi

          release_workflow_id="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/release-production.yml" \
            --jq '.id')"
          failed_run_json="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${FAILED_RUN_ID}")"
          jq -e \
            --arg failed_run_id "${FAILED_RUN_ID}" \
            --arg failed_release_sha "${FAILED_RELEASE_SHA}" \
            --argjson release_workflow_id "${release_workflow_id}" '
              (.id | tostring) == $failed_run_id
              and .workflow_id == $release_workflow_id
              and .name == "Release Production Console"
              and .event == "workflow_dispatch"
              and .status == "completed"
              and .conclusion == "failure"
              and .head_branch == "main"
              and .head_sha == $failed_release_sha
            ' <<<"${failed_run_json}" >/dev/null

          failed_jobs_json="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${FAILED_RUN_ID}/jobs?per_page=100")"
          jq -e '
            any(.jobs[];
              .name == "Release Production Console"
              and .status == "completed"
              and .conclusion == "failure"
              and any(.steps[];
                .name == "Verify Azure release identity"
                and .conclusion == "success")
              and any(.steps[];
                .name == "Release exact production console commit"
                and .conclusion == "failure"))
          ' <<<"${failed_jobs_json}" >/dev/null

          failed_logs="${RUNNER_TEMP}/failed-release-${FAILED_RUN_ID}.zip"
          failed_logs_text="${RUNNER_TEMP}/failed-release-${FAILED_RUN_ID}.log"
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${FAILED_RUN_ID}/logs" \
            >"${failed_logs}"
          unzip -p "${failed_logs}" >"${failed_logs_text}"
          if ! grep -Fq \
            'ERROR: shared production mutation lease returned a different owner identity' \
            "${failed_logs_text}"; then
            echo "ERROR: failed run does not prove the known post-acquire scalar-output incident" >&2
            exit 1
          fi

      - name: Audit protected recovery authority
        id: recovery_environment
        run: |
          set -euo pipefail
          azure_client_id="82ff99b2-0284-4aaf-a9a6-0d926bf01481"
          azure_subscription_id="3171575e-f164-425c-9ee0-2fb10cf93884"
          azure_tenant_id="d4b3813d-146f-4d03-96b8-d6e5862d58a2"
          production_control_storage_account="workforceosprodctrl"
          production_control_storage_container="production-control"
          production_control_storage_blob="workforce-os/initial-production-bootstrap/state-v1.json"
          guid_pattern='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
          [[ "${azure_client_id}" =~ ${guid_pattern} ]]
          [[ "${azure_subscription_id}" =~ ${guid_pattern} ]]
          [[ "${azure_tenant_id}" =~ ${guid_pattern} ]]
          [[ "${production_control_storage_account}" =~ ^[a-z0-9]{3,24}$ ]]
          [[ "${production_control_storage_container}" == "production-control" ]]
          [[ "${production_control_storage_blob}" == "workforce-os/initial-production-bootstrap/state-v1.json" ]]
          {
            printf 'azure_client_id=%s\n' "${azure_client_id}"
            printf 'azure_subscription_id=%s\n' "${azure_subscription_id}"
            printf 'azure_tenant_id=%s\n' "${azure_tenant_id}"
            printf 'production_control_storage_account=%s\n' "${production_control_storage_account}"
            printf 'production_control_storage_container=%s\n' "${production_control_storage_container}"
            printf 'production_control_storage_blob=%s\n' "${production_control_storage_blob}"
          } >>"${GITHUB_OUTPUT}"

      - name: Azure login with protected OIDC identity
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ steps.recovery_environment.outputs.azure_client_id }}
          subscription-id: ${{ steps.recovery_environment.outputs.azure_subscription_id }}
          tenant-id: ${{ steps.recovery_environment.outputs.azure_tenant_id }}

      - name: Verify Azure recovery identity
        env:
          AZURE_CLIENT_ID: ${{ steps.recovery_environment.outputs.azure_client_id }}
          AZURE_SUBSCRIPTION_ID: ${{ steps.recovery_environment.outputs.azure_subscription_id }}
          AZURE_TENANT_ID: ${{ steps.recovery_environment.outputs.azure_tenant_id }}
        run: |
          set -euo pipefail
          account_json="$(az account show --output json)"
          jq -e \
            --arg client_id "${AZURE_CLIENT_ID}" \
            --arg subscription_id "${AZURE_SUBSCRIPTION_ID}" \
            --arg tenant_id "${AZURE_TENANT_ID}" '
              (.id | ascii_downcase) == ($subscription_id | ascii_downcase)
              and (.tenantId | ascii_downcase) == ($tenant_id | ascii_downcase)
              and .state == "Enabled"
              and .isDefault == true
              and .user.type == "servicePrincipal"
              and (.user.name | ascii_downcase) == ($client_id | ascii_downcase)
            ' <<<"${account_json}" >/dev/null

      - name: Break only the proven stale shared lease
        env:
          AZURE_SUBSCRIPTION_ID: ${{ steps.recovery_environment.outputs.azure_subscription_id }}
          FAILED_RUN_ID: ${{ inputs.failed_run_id }}
          GH_TOKEN: ${{ github.token }}
          STORAGE_ACCOUNT: ${{ steps.recovery_environment.outputs.production_control_storage_account }}
          STORAGE_BLOB: ${{ steps.recovery_environment.outputs.production_control_storage_blob }}
          STORAGE_CONTAINER: ${{ steps.recovery_environment.outputs.production_control_storage_container }}
        run: |
          set -euo pipefail
          assert_no_running_releases() {
            local repository=$1
            local workflow=$2
            local runs_json
            if [[ "${repository}" == "${GITHUB_REPOSITORY}" ]]; then
              runs_json="$(gh api \
                "repos/${repository}/actions/workflows/${workflow}/runs?per_page=100")"
            else
              runs_json="$(curl --fail-with-body --silent --show-error \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "https://api.github.com/repos/${repository}/actions/workflows/${workflow}/runs?per_page=100")"
            fi
            jq -e '[.workflow_runs[] | select(.status != "completed")] | length == 0' \
              <<<"${runs_json}" >/dev/null
          }

          assert_no_release_lock() {
            local repository=$1
            local release_lock_ref=$2
            local response
            if [[ "${repository}" == "${GITHUB_REPOSITORY}" ]]; then
              if response="$(gh api "repos/${repository}/git/ref/heads/${release_lock_ref}" 2>&1)"; then
                echo "ERROR: ${repository} still holds ${release_lock_ref}" >&2
                return 1
              fi
            else
              if response="$(curl --fail-with-body --silent --show-error \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "https://api.github.com/repos/${repository}/git/ref/heads/${release_lock_ref}" 2>&1)"; then
                echo "ERROR: ${repository} still holds ${release_lock_ref}" >&2
                return 1
              fi
            fi
            if [[ "${response}" != *"404"* && "${response}" != *"Not Found"* ]]; then
              echo "ERROR: could not prove ${repository} release lock is absent" >&2
              return 1
            fi
          }

          remote_main_sha="$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
            --jq '.object.sha')"
          if [[ "${remote_main_sha}" != "${GITHUB_SHA}" ]]; then
            echo "ERROR: main advanced during stale-lease recovery" >&2
            exit 1
          fi

          assert_no_running_releases "Kloudedge-apex/Workforce-OS" "release-production.yml"
          assert_no_running_releases "Kloudedge-apex/apex-product" "release-production.yml"
          assert_no_release_lock "Kloudedge-apex/Workforce-OS" \
            "workforce-os-release-lock/production-console"
          assert_no_release_lock "Kloudedge-apex/apex-product" \
            "workforce-os-release-lock/production-gtm-platform"

          lease_json="$(az storage blob show \
            --account-name "${STORAGE_ACCOUNT}" \
            --container-name "${STORAGE_CONTAINER}" \
            --name "${STORAGE_BLOB}" \
            --auth-mode login \
            --subscription "${AZURE_SUBSCRIPTION_ID}" \
            --only-show-errors \
            --query properties.lease \
            --output json)"
          jq -e '
            .status == "locked"
            and .state == "leased"
            and .duration == "infinite"
          ' <<<"${lease_json}" >/dev/null

          az storage blob lease break \
            --account-name "${STORAGE_ACCOUNT}" \
            --container-name "${STORAGE_CONTAINER}" \
            --blob-name "${STORAGE_BLOB}" \
            --auth-mode login \
            --subscription "${AZURE_SUBSCRIPTION_ID}" \
            --lease-break-period 0 \
            --only-show-errors \
            --output none

          for _ in {1..12}; do
            lease_json="$(az storage blob show \
              --account-name "${STORAGE_ACCOUNT}" \
              --container-name "${STORAGE_CONTAINER}" \
              --name "${STORAGE_BLOB}" \
              --auth-mode login \
              --subscription "${AZURE_SUBSCRIPTION_ID}" \
              --only-show-errors \
              --query properties.lease \
              --output json)"
            if jq -e '
              .status == "unlocked"
              and (.state == "available" or .state == "broken" or .state == "expired")
            ' <<<"${lease_json}" >/dev/null; then
              {
                echo "### Stale production lease recovery"
                echo "- Failed release run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${FAILED_RUN_ID}"
                echo "- Shared lease: verified stale, broken, and read back unlocked"
                echo "- Application data: unchanged"
              } >>"${GITHUB_STEP_SUMMARY}"
              exit 0
            fi
            sleep 5
          done
          echo "ERROR: shared production mutation lease did not become unlocked" >&2
          exit 1
