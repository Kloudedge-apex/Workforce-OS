name: Release Production Console

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full 40-character lowercase SHA currently at protected main
        required: true
        type: string
      confirmation:
        description: Type RELEASE WORKFORCE OS PRODUCTION exactly
        required: true
        type: string

permissions:
  actions: read
  contents: write
  deployments: read
  id-token: write

concurrency:
  group: workforce-os-production
  cancel-in-progress: false

jobs:
  release-production:
    name: Release Production Console
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: workforce-os-production

    steps:
      - name: Admit protected main release request
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          EXPECTED_CONFIRMATION: RELEASE WORKFORCE OS PRODUCTION
          GH_TOKEN: ${{ github.token }}
          REF_PROTECTED: ${{ github.ref_protected }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: release_sha must be a full lowercase Git SHA" >&2
            exit 1
          fi
          if [[ "${RELEASE_SHA}" != "${GITHUB_SHA}" ]]; then
            echo "ERROR: confirmed release SHA does not equal the workflow commit" >&2
            exit 1
          fi
          if [[ "${CONFIRMATION}" != "${EXPECTED_CONFIRMATION}" ]]; then
            echo "ERROR: production confirmation phrase does not match" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "ERROR: production releases run only from main" >&2
            exit 1
          fi
          if [[ "${REF_PROTECTED}" != "true" ]]; then
            echo "ERROR: GitHub does not report main as protected" >&2
            exit 1
          fi
          remote_main_sha="$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
            --jq '.object.sha')"
          if [[ "${remote_main_sha}" != "${RELEASE_SHA}" ]]; then
            echo "ERROR: confirmed release SHA is not the current remote main head" >&2
            exit 1
          fi

      - name: Audit protected production environment
        id: protected_environment
        run: |
          set -euo pipefail
          # GitHub's workflow token cannot read Environment administration APIs.
          # The job declaration enforces the reviewed Environment. Public Azure
          # coordinates and the current NO-GO authority verdict are source-pinned.
          guid_pattern='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
          azure_client_id="350c994e-d076-42ab-bf56-4e923947dc32"
          azure_subscription_id="3171575e-f164-425c-9ee0-2fb10cf93884"
          azure_tenant_id="d4b3813d-146f-4d03-96b8-d6e5862d58a2"
          exclusive_authority="false"
          production_control_storage_account="ledgrstorage"
          production_control_storage_container="production-control"
          production_control_storage_blob="workforce-os/initial-production-bootstrap/state-v1.json"
          production_control_storage_resource_id="/subscriptions/3171575e-f164-425c-9ee0-2fb10cf93884/resourceGroups/Ledgr-prod/providers/Microsoft.Storage/storageAccounts/ledgrstorage"
          [[ "${azure_client_id}" =~ ${guid_pattern} ]]
          [[ "${azure_subscription_id}" =~ ${guid_pattern} ]]
          [[ "${azure_tenant_id}" =~ ${guid_pattern} ]]
          [[ "${exclusive_authority}" == "true" ]]
          [[ "${production_control_storage_account}" =~ ^[a-z0-9]{3,24}$ ]]
          [[ "${production_control_storage_container}" == "production-control" ]]
          [[ "${production_control_storage_blob}" == "workforce-os/initial-production-bootstrap/state-v1.json" ]]
          [[ "${production_control_storage_resource_id}" =~ ^/subscriptions/${azure_subscription_id}/resourceGroups/[A-Za-z0-9._()-]+/providers/Microsoft.Storage/storageAccounts/${production_control_storage_account}$ ]]

          {
            printf 'azure_client_id=%s\n' "${azure_client_id}"
            printf 'azure_subscription_id=%s\n' "${azure_subscription_id}"
            printf 'azure_tenant_id=%s\n' "${azure_tenant_id}"
            printf 'exclusive_authority=%s\n' "${exclusive_authority}"
            printf 'production_control_storage_account=%s\n' "${production_control_storage_account}"
            printf 'production_control_storage_container=%s\n' "${production_control_storage_container}"
            printf 'production_control_storage_blob=%s\n' "${production_control_storage_blob}"
            printf 'production_control_storage_resource_id=%s\n' "${production_control_storage_resource_id}"
          } >>"${GITHUB_OUTPUT}"

      - name: Checkout exact release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ inputs.release_sha }}

      - name: Materialize exact commit as local main
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          git checkout --force -B main "${RELEASE_SHA}"
          test "$(git rev-parse HEAD)" = "${RELEASE_SHA}"
          test "$(git rev-parse --abbrev-ref HEAD)" = "main"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Verify production release workflow source
        run: scripts/verify-production-release-workflow.sh .github/workflows/release-production.yml

      - name: Verify reviewed production trust pins
        run: |
          set -euo pipefail
          verify_pin() {
            local pin_file="$1"
            local pin_count pin_value
            if [[ ! -f "${pin_file}" || -L "${pin_file}" ]]; then
              echo "ERROR: reviewed trust pin is missing or unsafe: ${pin_file}" >&2
              return 1
            fi
            pin_count="$(awk '!/^[[:space:]]*#/ && NF { count++ } END { print count + 0 }' "${pin_file}")"
            pin_value="$(awk '!/^[[:space:]]*#/ && NF { print; exit }' "${pin_file}")"
            if [[ "${pin_count}" != "1" || ! "${pin_value}" =~ ^[0-9a-f]{64}$ ]]; then
              echo "ERROR: reviewed trust pin is not one full lowercase SHA-256: ${pin_file}" >&2
              return 1
            fi
          }
          verify_pin docs/ops/production-api-upstream-url.sha256
          verify_pin docs/ops/production-clerk-auth.sha256
          verify_pin docs/ops/production-clerk-publishable-key.sha256

      - name: Verify exact-commit GitHub CI
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: scripts/verify-github-console-release-ci.sh "${RELEASE_SHA}"

      - name: Azure login with protected OIDC identity
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ steps.protected_environment.outputs.azure_client_id }}
          subscription-id: ${{ steps.protected_environment.outputs.azure_subscription_id }}
          tenant-id: ${{ steps.protected_environment.outputs.azure_tenant_id }}

      - name: Verify Azure release identity
        env:
          AZURE_CLIENT_ID: ${{ steps.protected_environment.outputs.azure_client_id }}
          AZURE_SUBSCRIPTION_ID: ${{ steps.protected_environment.outputs.azure_subscription_id }}
          AZURE_TENANT_ID: ${{ steps.protected_environment.outputs.azure_tenant_id }}
        run: |
          set -euo pipefail
          account_json="$(az account show --output json)"
          jq -e \
            --arg client_id "${AZURE_CLIENT_ID}" \
            --arg subscription_id "${AZURE_SUBSCRIPTION_ID}" \
            --arg tenant_id "${AZURE_TENANT_ID}" '
              (.id | ascii_downcase) == ($subscription_id | ascii_downcase)
              and (.tenantId | ascii_downcase) == ($tenant_id | ascii_downcase)
              and .state == "Enabled"
              and .isDefault == true
              and .user.type == "servicePrincipal"
              and (.user.name | ascii_downcase) == ($client_id | ascii_downcase)
            ' <<<"${account_json}" >/dev/null

      - name: Release exact production console commit
        env:
          ACA_EXCLUSIVE_MUTATION_AUTHORITY_CONFIRMED: ${{ steps.protected_environment.outputs.exclusive_authority }}
          AZURE_SUBSCRIPTION_ID: ${{ steps.protected_environment.outputs.azure_subscription_id }}
          GH_TOKEN: ${{ github.token }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          WORKFORCE_PRODUCTION_CONTROL_STORAGE_ACCOUNT: ${{ steps.protected_environment.outputs.production_control_storage_account }}
          WORKFORCE_PRODUCTION_CONTROL_STORAGE_CONTAINER: ${{ steps.protected_environment.outputs.production_control_storage_container }}
          WORKFORCE_PRODUCTION_CONTROL_STORAGE_BLOB: ${{ steps.protected_environment.outputs.production_control_storage_blob }}
          WORKFORCE_PRODUCTION_CONTROL_STORAGE_RESOURCE_ID: ${{ steps.protected_environment.outputs.production_control_storage_resource_id }}
        run: |
          set -euo pipefail
          if [[ "${ACA_EXCLUSIVE_MUTATION_AUTHORITY_CONFIRMED}" != "true" ]]; then
            echo "ERROR: exclusive Container App authority is not attested by the protected environment" >&2
            exit 1
          fi
          if [[ -z "${VITE_CLERK_PUBLISHABLE_KEY}" ]]; then
            echo "ERROR: protected Clerk publishable key is unavailable" >&2
            exit 1
          fi
          ./scripts/deploy-console-prod.sh --yes
          {
            echo "### Production console release evidence"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Environment: \`workforce-os-production\`"
            echo "- Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Controller identity, CI run, ACR run, image digests, and verification results are retained in this run log."
          } >>"${GITHUB_STEP_SUMMARY}"
