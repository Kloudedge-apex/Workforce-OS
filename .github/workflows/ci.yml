name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "10.30.3"

jobs:
  validate:
    name: Type Check, Test & Build
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate API clients
        run: pnpm --filter @workspace/api-spec run codegen

      - name: Verify generated API clients are current
        run: |
          changes="$(git status --porcelain=v1 --untracked-files=all -- \
            lib/api-client-react/src/generated \
            lib/api-zod/src/generated)"
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            git diff -- \
              lib/api-client-react/src/generated \
              lib/api-zod/src/generated
            exit 1
          fi

      - name: Type check
        run: pnpm run typecheck

      - name: Run BFF tests
        run: pnpm --filter @workspace/api-server test

      - name: Run console tests
        run: pnpm --filter @workspace/workforce-os test
        env:
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_c2FmZS10ZXN0LW9ubHkk

      - name: Build console
        run: pnpm --filter @workspace/workforce-os build
        env:
          BASE_PATH: /
          PORT: "8080"
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_c2FmZS10ZXN0LW9ubHkk

      - name: Build BFF
        run: pnpm --filter @workspace/api-server build
