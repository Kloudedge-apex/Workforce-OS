kind = "web"
previewPath = "/"
title = "Workforce OS v2"
version = "1.0.0"
id = "artifacts/workforce-os"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21792

[services.development]
run = "pnpm --filter @workspace/workforce-os run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/workforce-os", "run", "build" ]
publicDir = "artifacts/workforce-os/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21792"
BASE_PATH = "/"
