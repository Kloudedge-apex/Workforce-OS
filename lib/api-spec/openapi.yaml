        newReply: { type: boolean }
      required:
        [
          emailEnabled,
          slackEnabled,
          approvalQueueFull,
          sendFailed,
          suppressionHit,
          weeklyReport,
          newReply,
        ]

    Notification:
      type: object
      properties:
        id: { type: string }
        type: { type: string }
        title: { type: string }
        body: { type: string }
        read: { type: boolean }
        link: { type: ["string", "null"] }
        createdAt: { type: string }
      required: [id, type, title, body, read, createdAt]

    NotificationList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        unreadCount: { type: integer }
      required: [items, unreadCount]

    WelcomeStatus:
      type: object
      properties:
        organization:
          type: object
          properties:
            nameSet: { type: boolean }
            websiteSet: { type: boolean }
            complete: { type: boolean }
          required: [nameSet, websiteSet, complete]
        senderIdentity:
          type: object
          properties:
            senderNameSet: { type: boolean }
            countrySet: { type: boolean }
            physicalAddressSet: { type: boolean }
            complete: { type: boolean }
          required: [senderNameSet, countrySet, physicalAddressSet, complete]
        icp:
          type: object
          properties:
            usable: { type: boolean }
            complete: { type: boolean }
          required: [usable, complete]
        mailbox:
          type: object
          properties:
            connected: { type: boolean }
            complete: { type: boolean }
          required: [connected, complete]
        sendReadiness:
          $ref: "#/components/schemas/SendReadiness"
        complete: { type: boolean }
        currentStep:
          type: string
          enum: [organization, sender_identity, icp, mailbox, complete]
        readyForLiveSend: { type: boolean }
      required:
        [
          organization,
          senderIdentity,
          icp,
          mailbox,
          sendReadiness,
          complete,
          currentStep,
          readyForLiveSend,
        ]

    GraphRun:
      type: object
      properties:
        id: { type: string }
        status:
          type: string
          enum: [RUNNING, AWAITING_APPROVAL, COMPLETED, FAILED, CANCELLED]
        stagesCompleted:
          type: array
          items: { type: string }
        leadsScored: { type: [integer, "null"] }
        artifactsGenerated: { type: [integer, "null"] }
        durationMs: { type: integer }
        costUsd: { type: [number, "null"] }
        approvedBy: { type: ["string", "null"] }
        startedAt: { type: string }
        completedAt: { type: ["string", "null"] }
      required:
        [
          id,
          status,
          stagesCompleted,
          leadsScored,
          artifactsGenerated,
          durationMs,
          costUsd,
          approvedBy,
          startedAt,
          completedAt,
        ]

    PaginatedRuns:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/GraphRun"
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }
      required: [items, total, page, limit]

    GraphRunDetail:
      type: object
      properties:
        run:
          $ref: "#/components/schemas/GraphRun"
        timeline:
          anyOf:
            - type: array
              items:
                $ref: "#/components/schemas/TimelineNode"
            - type: object
              properties:
                unavailable: { type: boolean, enum: [true] }
                feature: { type: string }
              required: [unavailable, feature]
      required: [run, timeline]

    Agent:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        type:
          type: string
          enum: [sdr, content, ops, pipeline, reply, reporting]
        status:
          type: string
          enum: [idle, running, error]
        lastAction: { type: ["string", "null"] }
        lastActionAt: { type: ["string", "null"] }
        recentActivityCount: { type: integer }
        sparklineData:
          type: array
          items: { type: integer }
      required: [id, name, type, status, recentActivityCount, sparklineData]

    UpdateCadenceInput:
      type: object
      properties:
        stages:
          type: array
          items:
            $ref: "#/components/schemas/CadenceStage"
      required: [stages]

    TimelineNode:
      type: object
      properties:
        id: { type: string }
        nodeType:
          type: string
          enum: [agent_run, llm_call, evaluator, tool_call, human_action]
        label: { type: string }
        summary: { type: string }
        reasoning: { type: ["string", "null"] }
        tokensUsed: { type: ["integer", "null"] }
        durationMs: { type: ["integer", "null"] }
        cost: { type: ["number", "null"] }
        score: { type: ["number", "null"] }
        timestamp: { type: string }
        children:
          type: array
          items:
            $ref: "#/components/schemas/TimelineNode"
      required: [id, nodeType, label, summary, timestamp, children]
