openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Workforce OS v2 API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: artifacts
    description: Outreach artifact operations
  - name: activity
    description: Agent activity stream
  - name: today
    description: Today page data
  - name: leads
    description: Lead and pipeline management
  - name: conversations
    description: Inbox and conversation threads
  - name: settings
    description: Organization settings and compliance
  - name: runs
    description: Pipeline run history
  - name: agents
    description: Agent roster and status
  - name: notifications
    description: In-app notifications
  - name: welcome
    description: Onboarding wizard
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /artifacts/pending:
    get:
      operationId: listPendingArtifacts
      tags: [artifacts]
      summary: List pending review artifacts
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 5 }
      responses:
        "200":
          description: Paginated list of pending artifacts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedArtifacts"

  /artifacts:
    get:
      operationId: listArtifacts
      tags: [artifacts]
      summary: List all artifacts with optional status filter
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING_REVIEW, APPROVED, SENT, REJECTED, SUPPRESSED]
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: List of outreach artifacts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedArtifacts"

  /artifacts/{id}:
    get:
      operationId: getArtifact
      tags: [artifacts]
      summary: Get a single artifact by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Artifact detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutreachArtifact"
        "404":
          description: Not found

  /artifacts/{id}/approve:
    post:
      operationId: approveArtifact
      tags: [artifacts]
      summary: Approve an outreach artifact
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Approved artifact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutreachArtifact"
        "404":
          description: Not found

  /artifacts/{id}/reject:
    post:
      operationId: rejectArtifact
      tags: [artifacts]
      summary: Reject an outreach artifact
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectInput"
      responses:
        "200":
          description: Rejected artifact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutreachArtifact"

  /artifacts/{id}/suppress:
    post:
      operationId: suppressArtifact
      tags: [artifacts]
      summary: Suppress recipient and artifact
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Suppressed artifact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutreachArtifact"

  /artifacts/bulk-approve:
    post:
      operationId: bulkApproveArtifacts
      tags: [artifacts]
      summary: Bulk approve artifacts that pass evaluators
      responses:
        "200":
          description: Bulk approve result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkApproveResult"

  /activity:
    get:
      operationId: getActivityStream
      tags: [activity]
      summary: Get agent activity stream
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
        - name: filter
          in: query
          schema:
            type: string
            enum: [all, outbound, pipeline, conversations]
            default: all
      responses:
        "200":
          description: Activity events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityEvent"

  /today/kpis:
    get:
      operationId: getTodayKpis
      tags: [today]
      summary: Get today's KPI tiles
      responses:
        "200":
          description: KPI data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodayKpis"

  /leads:
    get:
      operationId: listLeads
      tags: [leads]
      summary: List leads with filters
      parameters:
        - name: stage
          in: query
          schema: { type: string }
        - name: minScore
          in: query
          schema: { type: integer }
        - name: intentSignal
          in: query
          schema: { type: string }
        - name: geo
          in: query
          schema: { type: string }
        - name: cohort
          in: query
          schema: { type: string }
        - name: industry
          in: query
          schema: { type: string }
        - name: sort
          in: query
          schema: { type: string, default: score_desc }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 25 }
        - name: q
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Paginated leads
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedLeads"

  /leads/{id}:
    get:
      operationId: getLead
      tags: [leads]
      summary: Get lead detail
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Lead detail with evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadDetail"
        "404":
          description: Not found

  /leads/{id}/trigger-outbound:
    post:
      operationId: triggerOutbound
      tags: [leads]
      summary: Trigger an outbound pipeline run for a lead
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "202":
          description: Pipeline run triggered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriggerResult"

  /leads/bulk-suppress:
    post:
      operationId: bulkSuppressLeads
      tags: [leads]
      summary: Suppress multiple leads
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkLeadIds"
      responses:
        "200":
          description: Suppressed count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkActionResult"

  /conversations:
    get:
      operationId: listConversations
      tags: [conversations]
      summary: List conversation threads
      parameters:
        - name: sentiment
          in: query
          schema:
            type: string
            enum: [positive, objection, neutral, negative]
        - name: unread
          in: query
          schema: { type: boolean }
        - name: needsReply
          in: query
          schema: { type: boolean }
        - name: archived
          in: query
          schema: { type: boolean }
        - name: leadId
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Conversation list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedConversations"

  /conversations/{id}:
    get:
      operationId: getConversation
      tags: [conversations]
      summary: Get full conversation thread
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Full conversation with messages and reply intelligence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationDetail"
        "404":
          description: Not found

  /conversations/{id}/draft-reply:
    post:
      operationId: draftReply
      tags: [conversations]
      summary: Generate a reply draft inline
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "202":
          description: Draft queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriggerResult"

  /conversations/{id}/archive:
    post:
      operationId: archiveConversation
      tags: [conversations]
      summary: Archive a conversation thread
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkActionResult"

  /runs:
    get:
      operationId: listRuns
      tags: [runs]
      summary: Paginated GraphRun history
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
        - name: status
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Paginated graph runs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedRuns"

  /runs/trigger:
    post:
      operationId: triggerRun
      tags: [runs]
      summary: Start a new pipeline run
      responses:
        "202":
          description: Run started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriggerResult"

  /runs/{id}:
    get:
      operationId: getRun
      tags: [runs]
      summary: Get full evidence timeline for one run
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Run with evidence timeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphRunDetail"
        "404":
          description: Not found

  /agents:
    get:
      operationId: listAgents
      tags: [agents]
      summary: Active agent roster with recent activity
      responses:
        "200":
          description: Agent list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Agent"

  /settings/org:
    get:
      operationId: getOrgSettings
      tags: [settings]
      summary: Get organization settings and compliance state
      responses:
        "200":
          description: Organization settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgSettings"
    put:
      operationId: updateOrgSettings
      tags: [settings]
      summary: Update organization settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrgInput"
      responses:
        "200":
          description: Updated org settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgSettings"

  /settings/org/health:
    get:
      operationId: getOrgHealth
      tags: [settings]
      summary: Get org compliance health summary
      responses:
        "200":
          description: Org health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgHealth"

  /settings/icp:
    get:
      operationId: getIcpProfile
      tags: [settings]
      summary: Get ICP profile
      responses:
        "200":
          description: ICP profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IcpProfile"
    put:
      operationId: updateIcpProfile
      tags: [settings]
      summary: Update ICP profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IcpProfile"
      responses:
        "200":
          description: Updated ICP profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IcpProfile"

  /settings/integrations:
    get:
      operationId: listIntegrations
      tags: [settings]
      summary: List integration connection states
      responses:
        "200":
          description: Integration list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Integration"

  /settings/integrations/{provider}/connect:
    post:
      operationId: connectIntegration
      tags: [settings]
      summary: Connect an integration (stub OAuth)
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Integration"

  /settings/integrations/{provider}/disconnect:
    post:
      operationId: disconnectIntegration
      tags: [settings]
      summary: Disconnect an integration
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Disconnected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Integration"

  /settings/cadence:
    get:
      operationId: getCadence
      tags: [settings]
      summary: Get sequence cadence config
      responses:
        "200":
          description: Cadence stages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CadenceStage"
    put:
      operationId: updateCadence
      tags: [settings]
      summary: Update sequence cadence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCadenceInput"
      responses:
        "200":
          description: Updated cadence
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CadenceStage"

  /settings/style:
    get:
      operationId: getStyleConfig
      tags: [settings]
      summary: Get brand voice and style config
      responses:
        "200":
          description: Style config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StyleConfig"
    put:
      operationId: updateStyleConfig
      tags: [settings]
      summary: Update brand voice config
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StyleConfig"
      responses:
        "200":
          description: Updated style
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StyleConfig"

  /settings/team:
    get:
      operationId: listTeamMembers
      tags: [settings]
      summary: List team members and roles
      responses:
        "200":
          description: Team members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamMember"

  /settings/team/invite:
    post:
      operationId: inviteTeamMember
      tags: [settings]
      summary: Invite a team member by email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteInput"
      responses:
        "200":
          description: Invited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMember"

  /settings/team/{userId}:
    delete:
      operationId: removeTeamMember
      tags: [settings]
      summary: Remove a team member
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkActionResult"

  /settings/billing:
    get:
      operationId: getBilling
      tags: [settings]
      summary: Get plan, usage, and invoice history
      responses:
        "200":
          description: Billing info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingInfo"

  /settings/api-keys:
    get:
      operationId: listApiKeys
      tags: [settings]
      summary: List API keys (prefix only)
      responses:
        "200":
          description: API key list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiKey"
    post:
      operationId: createApiKey
      tags: [settings]
      summary: Issue a new API key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKeyInput"
      responses:
        "201":
          description: Created key (full value shown once)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyCreated"

  /settings/api-keys/{id}:
    delete:
      operationId: revokeApiKey
      tags: [settings]
      summary: Revoke an API key
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkActionResult"

  /settings/notifications:
    get:
      operationId: getNotificationPrefs
      tags: [settings]
      summary: Get notification preferences
      responses:
        "200":
          description: Notification prefs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPrefs"
    put:
      operationId: updateNotificationPrefs
      tags: [settings]
      summary: Update notification preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationPrefs"
      responses:
        "200":
          description: Updated prefs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPrefs"

  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: Get bell dropdown content
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationList"

  /notifications/mark-read:
    post:
      operationId: markNotificationsRead
      tags: [notifications]
      summary: Mark all notifications read
      responses:
        "200":
          description: Marked read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkActionResult"

  /welcome/status:
    get:
      operationId: getWelcomeStatus
      tags: [welcome]
      summary: Get onboarding progress
      responses:
        "200":
          description: Welcome status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WelcomeStatus"

  /welcome/complete:
    post:
      operationId: completeWelcome
      tags: [welcome]
      summary: Mark onboarding as complete
      responses:
        "200":
          description: Completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WelcomeStatus"

  /graph-runs/{id}/timeline:
    get:
      operationId: getGraphRunTimeline
      tags: [activity]
      summary: Get evidence timeline for a graph run
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Evidence timeline nodes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimelineNode"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]

    Recipient:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        title: { type: string }
        company: { type: string }
        avatarUrl: { type: ["string", "null"] }
      required: [id, name, email, company]

    EvaluatorScores:
      type: object
      properties:
        pii: { type: number }
        hallucination: { type: number }
        citationCoverage: { type: number }
        toxicity: { type: number }
      required: [pii, hallucination, citationCoverage, toxicity]

    FactCitation:
      type: object
      properties:
        factId: { type: string }
        claim: { type: string }
        source: { type: string }
      required: [factId, claim, source]

    SendPolicy:
      type: object
      properties:
        liveSendEnabled: { type: boolean }
        postalAddressSet: { type: boolean }
        unsubscribeConfigured: { type: boolean }
        recipientSuppressed: { type: boolean }
      required: [liveSendEnabled, postalAddressSet, unsubscribeConfigured, recipientSuppressed]

    OutreachArtifact:
      type: object
      properties:
        id: { type: string }
        status:
          type: string
          enum: [PENDING_REVIEW, APPROVED, SENT, REJECTED, SUPPRESSED]
        recipient:
          $ref: "#/components/schemas/Recipient"
        subject: { type: string }
        bodyHtml: { type: string }
        citations:
          type: array
          items:
            $ref: "#/components/schemas/FactCitation"
        evaluatorScores:
          $ref: "#/components/schemas/EvaluatorScores"
        sendPolicy:
          $ref: "#/components/schemas/SendPolicy"
        createdAt: { type: string }
        approvedAt: { type: ["string", "null"] }
        sentAt: { type: ["string", "null"] }
        rejectionReason: { type: ["string", "null"] }
        graphRunId: { type: ["string", "null"] }
        cohort: { type: ["string", "null"] }
      required: [id, status, recipient, subject, bodyHtml, citations, evaluatorScores, sendPolicy, createdAt]

    PaginatedArtifacts:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OutreachArtifact"
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }
      required: [items, total, page, limit]

    RejectInput:
      type: object
      properties:
        reason: { type: string }
      required: [reason]

    BulkApproveResult:
      type: object
      properties:
        approved: { type: integer }
        skipped: { type: integer }
        reasons:
          type: array
          items: { type: string }
      required: [approved, skipped, reasons]

    ActivityEvent:
      type: object
      properties:
        id: { type: string }
        agentName: { type: string }
        agentType:
          type: string
          enum: [sdr, content, ops, pipeline, reply, reporting]
        action: { type: string }
        stage: { type: string }
        timestamp: { type: string }
        artifactId: { type: ["string", "null"] }
        leadId: { type: ["string", "null"] }
      required: [id, agentName, agentType, action, stage, timestamp]

    TodayKpis:
      type: object
      properties:
        artifactsPending: { type: integer }
        artifactsSentToday: { type: integer }
        replyRate7d: { type: number }
        qualifiedMeetingsBooked: { type: integer }
        leadsSourcedToday: { type: integer }
        leadsScored: { type: integer }
      required: [artifactsPending, artifactsSentToday, replyRate7d, qualifiedMeetingsBooked, leadsSourcedToday, leadsScored]

    IntentSignal:
      type: object
      properties:
        label: { type: string }
        confidence: { type: number }
      required: [label, confidence]

    Lead:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        title: { type: string }
        email: { type: string }
        company: { type: string }
        domain: { type: ["string", "null"] }
        companyLogoUrl: { type: ["string", "null"] }
        avatarUrl: { type: ["string", "null"] }
        score: { type: integer }
        stage: { type: string }
        geo: { type: string }
        country: { type: ["string", "null"] }
        industry: { type: ["string", "null"] }
        headcountEstimate: { type: ["string", "null"] }
        cohort: { type: string, enum: [A, B] }
        emailStatus: { type: string, enum: [DELIVERABLE, HIGH_PROBABILITY, CATCH_ALL] }
        intentSignals:
          type: array
          items:
            $ref: "#/components/schemas/IntentSignal"
        lastContactedAt: { type: ["string", "null"] }
        sendPolicy:
